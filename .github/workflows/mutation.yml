name: Mutation pilot

on:
  pull_request:
    paths-ignore: ['**/*.md']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, changed]
        default: all
      suite:
        description: Stages to execute; integration keeps compatible unit evidence
        type: choice
        options: [all, unit, integration]
        default: all
      budget:
        description: Aggregate mutation execution seconds, at most 3600
        type: number
        default: 3600
      package:
        description: Optional comma-separated workspace basenames for bounded diagnostics
        type: string
      quantum:
        description: Maximum seconds per stage visit
        type: number
        default: 120
      files:
        description: Optional comma-separated workspace-relative source files for acceptance exercises
        type: string
      import_run:
        description: Explicit same-repository checkpoint run ID for acceptance continuation
        type: string
      isolated_redis:
        description: Compare the Redis pilot with isolated per-mutation containers
        type: boolean
        default: false
      postgres_fixture:
        description: PostgreSQL fixture mode; compare runs four cold ProfileStore samples on one runner
        type: choice
        options: [reused, isolated, compare]
        default: reused
      nats_fixture:
        description: NATS publication fixture; reuse requires separate acceptance, compare is a fixed cold scope
        type: choice
        options: [isolated, reused, compare, reset-failure, cancel-after-progress]
        default: isolated
      reset_failure:
        description: Inject a Redis reset failure to verify diagnostics and owned cleanup
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mutation-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Advisory mutation pilot
    runs-on: ubuntu-latest
    # Setup, execution, remote transfer, upload and cleanup have finite deadlines.
    # Budget expiry stops the coordinator before upload's separate deadline.
    timeout-minutes: 110
    env:
      SCOPE: ${{ github.event_name == 'pull_request' && 'changed' || inputs.scope || 'all' }}
      SELECT_SUITE: ${{ inputs.suite || 'all' }}
      BUDGET: ${{ github.event_name == 'pull_request' && '900' || inputs.budget || '3600' }}
      QUANTUM: ${{ inputs.quantum || '120' }}
      SELECT_PACKAGE: ${{ inputs.package }}
      SELECT_FILES: ${{ inputs.files }}
      IMPORT_RUN: ${{ inputs.import_run }}
      MUTATION_REDIS_ISOLATED: ${{ inputs.isolated_redis && '1' || '0' }}
      POSTGRES_FIXTURE: ${{ inputs.postgres_fixture || 'reused' }}
      NATS_FIXTURE: ${{ inputs.nats_fixture || 'isolated' }}
      RESET_FAILURE_INPUT: ${{ inputs.reset_failure }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install locked project tools
        uses: jdx/mise-action@v5
        timeout-minutes: 5
        with:
          version: '2026.10.17'
          install_args: --locked
          github_token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          persist_github_token: false
      - name: Verify effective tools
        timeout-minutes: 2
        run: make toolchain
      - name: Install and build
        timeout-minutes: 15
        run: |
          make install
          make build
      - name: Import explicitly selected acceptance checkpoint
        if: github.event_name != 'pull_request' && inputs.import_run != ''
        timeout-minutes: 2
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$IMPORT_RUN" =~ ^[0-9]+$ ]] || exit 1
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMPORT_RUN" |
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg branch "$default_branch" '
              .repository.full_name == $repository and
              .head_repository.full_name == $repository and
              .head_branch == $branch and
              .path == ".github/workflows/mutation.yml" and
              .status == "completed" and .conclusion == "success" and
              (.event == "schedule" or .event == "workflow_dispatch" or .event == "push")
            ' > /dev/null
          gh run download "$IMPORT_RUN" --repo "$GITHUB_REPOSITORY" --name mutation-checkpoint --dir /tmp/mutation-import
      - name: Run bounded advisory analysis
        timeout-minutes: 63
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
        run: |
          [[ "$BUDGET" =~ ^[0-9]+$ ]] && (( BUDGET >= 1 && BUDGET <= 3600 )) || exit 1
          [[ "$QUANTUM" =~ ^[0-9]+$ ]] && (( QUANTUM >= 1 && QUANTUM <= 600 )) || exit 1
          case "$SCOPE" in all|changed) ;; *) exit 1 ;; esac
          [[ "$BASE" =~ ^([a-f0-9]{40}|origin/main)$ ]] || exit 1
          export MUTATION_NATS_ORDER=native MUTATION_NATS_CANCEL=off
          unset WALLPAPERDB_MUTATION_PLAN_ORDER
          case "$POSTGRES_FIXTURE" in
            reused) export MUTATION_POSTGRES_ISOLATED=0 ;;
            isolated) export MUTATION_POSTGRES_ISOLATED=1 ;;
            compare) ;;
            *) exit 1 ;;
          esac
          case "$NATS_FIXTURE" in
            isolated) export MUTATION_NATS_ISOLATED=1 ;;
            reused|compare) export MUTATION_NATS_ISOLATED=0 ;;
            reset-failure|cancel-after-progress)
              [[ "$EVENT_NAME" == workflow_dispatch && "$SCOPE" == all &&
                 "$SELECT_SUITE" == all && "$SELECT_PACKAGE" == color-extractor &&
                 "$SELECT_FILES" == src/adapters/events/broker.ts &&
                 -z "$IMPORT_RUN" && "$RESET_FAILURE_INPUT" != true &&
                 "$POSTGRES_FIXTURE" != compare ]] || exit 1
              export MUTATION_NATS_ISOLATED=0
              if [[ "$NATS_FIXTURE" == reset-failure ]]; then
                export MUTATION_NATS_RESET_FAILURE=after-progress
              else
                [[ "$BUDGET" == 60 && "$QUANTUM" == 60 ]] || exit 1
                export MUTATION_NATS_CANCEL=after-progress
              fi ;;
            *) exit 1 ;;
          esac
          args=(--scope "$SCOPE" --base "$BASE" --budget "$BUDGET" --quantum "$QUANTUM")
          if [[ "$EVENT_NAME" == pull_request ]]; then
            unset GH_TOKEN GITHUB_TOKEN
            args+=(--offline)
          fi
          case "$SELECT_SUITE" in
            all) ;;
            unit|integration) args+=(--suite "$SELECT_SUITE") ;;
            *) exit 1 ;;
          esac
          if [[ -n "$SELECT_PACKAGE" ]]; then
            [[ "$SELECT_PACKAGE" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]] || exit 1
            args+=(--package "$SELECT_PACKAGE")
          fi
          if [[ -n "$SELECT_FILES" ]]; then
            [[ "$SELECT_FILES" =~ ^src/[A-Za-z0-9_./,@+-]+$ ]] || exit 1
            args+=(--files "$SELECT_FILES")
          fi
          if [[ -n "$IMPORT_RUN" ]]; then args+=(--baseline /tmp/mutation-import/checkpoint.json --offline); fi
          if [[ "$RESET_FAILURE_INPUT" == true ]]; then export MUTATION_REDIS_RESET_FAILURE=1; fi
          if [[ "$NATS_FIXTURE" == reset-failure || "$NATS_FIXTURE" == cancel-after-progress ]]; then
            # Fixed cold native failure exercise. No checkpoint import, remote
            # restoration or previous report may bypass its execution path.
            args+=(--offline)
            common=$(git rev-parse --path-format=absolute --git-common-dir)
            rm -rf -- "$common/mutation/v1/color-extractor" "$common/mutation/repository-v1" reports/mutation apps/color-extractor/reports/mutation
            # The reset fault counter alone is not native progress. Cancellation
            # instead requires completed/current native timing receipts inside
            # the controller. Raw results establish either observed boundary.
          fi
          if [[ "$POSTGRES_FIXTURE" == compare || "$NATS_FIXTURE" == compare ]]; then
            # A diagnostic comparison has one fixed source/suite scope and four
            # cold invocations. No imported/remote or prior-sample conclusions.
            [[ "$EVENT_NAME" == workflow_dispatch && "$SCOPE" == all &&
               "$SELECT_SUITE" == all &&
               -z "$IMPORT_RUN" && "$RESET_FAILURE_INPUT" != true ]] || exit 1
            if [[ "$POSTGRES_FIXTURE" == compare ]]; then
              [[ "$NATS_FIXTURE" == isolated && "$SELECT_PACKAGE" == user &&
                 "$SELECT_FILES" == src/adapters/profiles/index.ts ]] || exit 1
              family=postgres
            else
              [[ "$SELECT_PACKAGE" == color-extractor &&
                 "$SELECT_FILES" == src/adapters/events/broker.ts ]] || exit 1
              family=nats
            fi
            (( BUDGET >= 24 )) || exit 1
            sample_budget=$(( BUDGET / 4 ))
            args+=(--offline)
            for (( index=0; index<${#args[@]}; index++ )); do
              if [[ "${args[index]}" == --budget ]]; then args[index+1]=$sample_budget; fi
            done
            comparison="$RUNNER_TEMP/wallpaperdb-$family-comparison"
            mkdir -p "$comparison"
            common=$(git rev-parse --path-format=absolute --git-common-dir)
            comparison_status=0
            comparison_start=$SECONDS
            for sample in isolated-1 reused-1 reused-2 isolated-2; do
              case "$sample" in
                isolated-*) isolation=1 ;;
                reused-*) isolation=0 ;;
              esac
              if [[ "$family" == postgres ]]; then export MUTATION_POSTGRES_ISOLATED=$isolation;
              else
                export MUTATION_NATS_ISOLATED=$isolation
                case "$sample" in
                  *-1) export MUTATION_NATS_ORDER=native ;;
                  *-2) export MUTATION_NATS_ORDER=reverse ;;
                esac
              fi
              # These are this fresh hosted checkout's diagnostic caches only.
              rm -rf -- "$common/mutation/v1/$SELECT_PACKAGE" "$common/mutation/repository-v1" reports/mutation "apps/$SELECT_PACKAGE/reports/mutation"
              destination="$comparison/$sample"
              mkdir -p "$destination"
              sample_start=$SECONDS
              set +e
              make test-mutation ARGS="${args[*]}" > "$destination/execution.log" 2>&1
              sample_status=$?
              set -e
              sample_elapsed=$(( SECONDS - sample_start ))
              if [[ -d reports/mutation ]]; then cp -R reports/mutation "$destination/coordinator"; fi
              if [[ -d "apps/$SELECT_PACKAGE/reports/mutation" ]]; then cp -R "apps/$SELECT_PACKAGE/reports/mutation" "$destination/$SELECT_PACKAGE"; fi
              jq -n --arg sample "$sample" --arg commit "$(git rev-parse HEAD)" \
                --arg base "$BASE" --arg runner "$RUNNER_NAME" \
                --arg image_os "${ImageOS:-unknown}" --arg image_version "${ImageVersion:-unknown}" \
                --arg isolation "$isolation" \
                --argjson budget "$sample_budget" --argjson elapsed "$sample_elapsed" \
                --argjson status "$sample_status" \
                '{sample:$sample,commit:$commit,base:$base,runner:$runner,imageOS:$image_os,imageVersion:$image_version,isolated:$isolation,budgetSeconds:$budget,wholeCommandSeconds:$elapsed,exitStatus:$status,cache:"cold; remote/import disabled"}' \
                > "$destination/invocation.json"
              if [[ "$family" == nats ]]; then
                jq --arg order "$MUTATION_NATS_ORDER" '. + {planOrder:$order}' \
                  "$destination/invocation.json" > "$destination/invocation.tmp"
                mv "$destination/invocation.tmp" "$destination/invocation.json"
              fi
              report="$destination/coordinator/summary.json"
              if [[ ! -f "$report" ]]; then
                comparison_status=1
              else
                jq -r --arg sample "$sample" '"- \($sample): \(.outcome), \(.processed)/\(.total) processed, \(.elapsedSeconds)s coordinator elapsed; full baseline complete: \(.fullBaselineComplete)."' "$report" >> "$GITHUB_STEP_SUMMARY"
                if [[ "$sample_status" != 0 ]] &&
                   ! { [[ "$sample_status" == 2 ]] && [[ "$(jq -r .outcome "$report")" == incomplete ]]; }; then
                  comparison_status=1
                fi
              fi
            done
            docker ps -a --filter name=wallpaperdb-mutation- --format '{{.ID}} {{.Names}}' > "$comparison/remaining-containers.txt"
            if [[ -s "$comparison/remaining-containers.txt" ]]; then comparison_status=1; fi
            echo "Comparison whole elapsed: $(( SECONDS - comparison_start )) seconds; aggregate coordinator budget: $(( sample_budget * 4 )) seconds. Timings are inclusive and must not be summed." >> "$GITHUB_STEP_SUMMARY"
            exit "$comparison_status"
          fi
          # Every forwarded value above is one validated shell word. Make owns
          # dependency preparation and invokes the uncached coordinator directly.
          set +e
          make test-mutation ARGS="${args[*]}"
          status=$?
          set -e
          report=reports/mutation/summary.json
          if [[ ! -f "$report" ]]; then exit 1; fi
          jq '{runtime, runtimeDiagnostics}' "$report"
          jq -r '"Mutation outcome: **\(.outcome)**\n\nProcessed \(.processed)/\(.total) discovered mutations. Full eligible baseline complete: \(.fullBaselineComplete). Selected scope complete: \(.selectedScopeComplete). Checkpoint saved: \(.checkpointSaved).\n\nExecution elapsed: \(.elapsedSeconds) seconds. Remote state: \(.remote).\n\nUndiscovered files, pending results and errors remain explicit in the JSON report. This pilot is advisory."' "$report" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.stages[] | "- \(.workspace)/\(.suite): \(.outcome), \(.executed) executed, \(.reused // 0) reused, \(.selectedTests // 0) coverage-selected test invocations, \(.elapsedSeconds)s; fixture \(.fixture // {})"' "$report" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"\nInput identity: `\(.inputIdentity)`; scope: \(.scope). Full eligible mutation count: \(.fullEligibleTotal // "unknown until all source files are discovered").\n", (.workspaces[] | "- \(.workspace): \(.processed)/\(.total) discovered mutations processed; score \(.mutationScore // "unavailable")%; errors \(.errors); pending \(.pending); all eligible sources discovered: \(.discovered).")' "$report" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"\nExclusions and limitations:\n", (.inventory.workspaces | to_entries[] | select(.value.decision == "excluded" or .value.limitations) | "- \(.key): \(.value.reason // .value.limitations.reason) Follow-up: \(.value.followUp // .value.limitations.followUp)")' "$report" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == 2 ]] && [[ "$(jq -r .outcome "$report")" == incomplete ]]; then
            echo '::warning::Mutation analysis incomplete. Progress was saved for continuation; this pilot is advisory.'
            exit 0
          fi
          exit "$status"
      - name: Save cumulative checkpoint
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: mutation-checkpoint
          path: reports/mutation/checkpoint.json
          if-no-files-found: warn
          retention-days: 90
      - name: Save mutation reports and diagnostics
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            reports/mutation/summary.json
            apps/*/reports/mutation/*/summary.json
            apps/*/reports/mutation/*/mutation.json
            apps/*/reports/mutation/*/mutation.html
            packages/*/reports/mutation/*/summary.json
            packages/*/reports/mutation/*/mutation.json
            packages/*/reports/mutation/*/mutation.html
            apps/user/reports/mutation/integration/run-*/*.json
            apps/user/reports/mutation/integration/run-*/*.jsonl
            apps/color-extractor/reports/mutation/integration/run-*/*.json
            apps/color-extractor/reports/mutation/integration/run-*/*.jsonl
            ${{ runner.temp }}/wallpaperdb-postgres-comparison/
            ${{ runner.temp }}/wallpaperdb-nats-comparison/
          if-no-files-found: warn
          retention-days: 30
