<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Color search · Review batch</title>
  <link rel="stylesheet" href="/evaluation/batch-review.css">
  <script type="module" src="/evaluation/batch-review.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#review">Skip to comparison</a>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◫</span><div><strong>Color search</strong><span>Human evaluation</span></div></div>
    <div class="header-progress"><strong id="progress-count">Loading comparisons…</strong><span id="storage-status">Your progress saves in this browser.</span></div>
    <div class="header-actions"><button id="export" type="button" disabled>Export JSON</button><button id="submit" class="primary" type="button" disabled>Submit answers</button></div>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div class="workspace">
    <aside class="sidebar">
      <details id="case-menu" open>
        <summary><span>Comparisons</span><span id="menu-count" class="muted"></span></summary>
        <p class="sidebar-help">Review in any order. Submit whenever you like.</p>
        <nav id="case-list" aria-label="Choose a comparison"></nav>
      </details>
      <div class="sidebar-footer"><p id="submission-status">No answers submitted yet.</p><button id="clear" class="quiet" type="button" disabled>Clear browser draft</button></div>
    </aside>
    <main id="review" tabindex="-1">
      <div class="loading"><h1>Getting your comparisons ready</h1><p>The photographs are shown unchanged, with no suggested ranking.</p></div>
    </main>
  </div>
  <noscript><p class="notice">Enable JavaScript to save and submit these comparisons.</p></noscript>
</body>
</html>
