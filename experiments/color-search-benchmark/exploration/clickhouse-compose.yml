# Isolated throwaway service. Bind HTTP only to loopback; unrelated stacks remain untouched.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.9.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:19218:8123"
    mem_limit: 12g
    cpus: 8
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - color-exploration-clickhouse:/var/lib/clickhouse
volumes:
  color-exploration-clickhouse:
