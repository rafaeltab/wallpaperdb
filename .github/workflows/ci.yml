name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  ci:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      USE_VERCEL_CACHE: ${{ vars.TURBO_TEAM != '' && (github.actor_id == '29227505' || github.actor_id == '290168728') && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install locked project tools
        uses: jdx/mise-action@v5
        with:
          version: '2026.10.17'
          install_args: --locked

      - name: Verify effective tools
        run: make toolchain

      - name: Install dependencies
        run: make install
        env:
          CURSOR_SECRET: ${{ secrets.CURSOR_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_BASE_TEST_EMAIL: ${{ secrets.E2E_BASE_TEST_EMAIL }}
          E2E_BASE_TEST_PASSWORD: ${{ secrets.E2E_BASE_TEST_PASSWORD }}

      - name: Set up Vercel Remote Cache
        if: env.USE_VERCEL_CACHE == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Report unavailable Turbo cache
        if: env.USE_VERCEL_CACHE != 'true'
        run: echo '::warning::Vercel Remote Cache is unavailable for this run; Turbo tasks have no shared cache.'
      - name: Build, lint, and type-check
        run: make check

      - name: Use the public Ubuntu archive
        run: |
          # Hosted runners select Azure through this mirror list as well as direct URLs.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's#(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://azure\.archive\.ubuntu\.com/ubuntu)/?([[:space:]]|$)#https://archive.ubuntu.com/ubuntu/\2#g' "$source"
              cat "$source"
            fi
          done

      - name: Install Chromium for browser adapter contracts
        run: make run PACKAGE=web SCRIPT=test:browser:install

      - name: Run unit and integration tests
        run: |
          make test-unit
          make test-integration
        env:
          TURBO_TOKEN: ''
          TURBO_TEAM: ''

      - name: Merge coverage reports
        run: pnpm coverage:merge

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: ci
          token: ${{ secrets.CODECOV_TOKEN }}
