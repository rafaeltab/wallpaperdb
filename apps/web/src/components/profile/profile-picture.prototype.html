</style></head><body>
<div class="prototype"><strong>Throwaway prototype</strong><span>Profile picture • #386–#390 • simulated processing and saving</span></div>
<div class="tools"><label>Explore state <select id="scenario"><option value="select">Choose a source</option><option value="drag">Dragging a file</option><option value="crop">Crop and zoom</option><option value="processing">Processing</option><option value="saving">Saving</option><option value="error">Upload failed</option><option value="decode">Initial selection failed</option><option value="conflict">Profile changed elsewhere</option><option value="loading">Saved avatar loading</option><option value="unavailable">Avatar unavailable</option></select></label><button id="theme">Dark theme</button><button id="mobile">Mobile width</button><button id="motion">Reduced motion</button></div>
<section class="app" id="app" aria-label="WallpaperDB design preview">
<nav class="nav"><div class="wordmark">wallpaper<span>db</span></div><div class="nav-end"><span>Discover</span><span>Upload</span><span id="navavatar"></span></div></nav>
<div class="settings"><span id="settingavatar"></span><div><strong>Rafael</strong><span class="small">@rafaeltab</span><div class="rule"></div></div></div>
<main class="stage" id="stage"></main>
</section>
<div class="switcher"><button id="prev" aria-label="Previous layout">←</button><span id="variant-label"></span><button id="next" aria-label="Next layout">→</button></div>
<div class="notes"><span id="description"></span><span>Try the zoom slider and Apply.</span></div>
<div id="state" class="state" aria-live="polite"></div>
<input id="file" class="sr" type="file" accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Choose picture">
<script>
const icons={upload:'<path d="M12 16V3m-5 5 5-5 5 5"/><path d="M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',x:'<path d="m6 6 12 12M6 18 18 6"/>',reset:'<path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/>',warn:'<path d="m10.3 3.8-8 14a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/>'};
const icon=name=>'<svg aria-hidden="true" viewBox="0 0 24 24">'+icons[name]+'</svg>';
const demoSvg='<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#6293a6"/><stop offset="1" stop-color="#e3caaa"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#527f88"/><stop offset="1" stop-color="#193f53"/></linearGradient></defs><path fill="url(#sky)" d="M0 0h1024v1024H0z"/><circle cx="720" cy="260" r="66" fill="#f1d7a5"/><path fill="#789499" d="m0 530 220-270 200 240L645 175l379 340v509H0z"/><path fill="#d5ded7" d="m645 175-145 211 98-46 47 49 27-84 75 32z"/><path fill="#3b626b" d="m0 650 300-280 240 290 246-223 238 209v378H0z"/><path fill="url(#water)" d="M0 665h1024v359H0z"/><path fill="#2a4e54" d="M0 670q150-100 290 0L0 960zm1024 0q-140-90-280 0l280 250z"/><path fill="#102f35" d="m0 685 56-150 58 150H80l55 120H0zm900-5 50-190 58 190h-30l46 150H875z"/><path fill="#e4cfb5" opacity=".25" d="m640 710-130 314h240L685 710z"/></svg>';
let sample='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(demoSvg),source=sample,sourceSize=1024,zoom=1,panX=0,panY=0,phase='select',variant='A',dark=false,mobile=false,reduced=false,timer=null,dragDepth=0;
try{const v=new URL(location.href).searchParams.get('variant');if(['A','B','C'].includes(v))variant=v}catch{}
const names={A:'Focused dialog',B:'Preview + source rail',C:'Steps + action dock'};
const descriptions={A:'A keeps the current single-column dialog. Recommended.',B:'B separates the image from source choices and operational feedback.',C:'C makes selection, framing, and saving explicit steps.'};
const app=document.querySelector('#app'),stage=document.querySelector('#stage');
function avatar(large=false){const busy=phase==='loading',fail=phase==='unavailable';return '<span role="img" aria-label="'+(fail?'Profile picture unavailable':busy?'Loading profile picture':"Rafael’s profile picture")+'" class="avatar '+(large?'large ':'')+(busy?'status-avatar':fail?'fallback':'')+'">'+(busy?'<span class="spinner" aria-hidden="true"></span>':fail?'RB':'<img src="'+source+'" alt="">')+'</span>'}
function select(){phase='crop';zoom=1;panX=panY=0;render()}
function drop(){return '<div class="drop '+(phase==='drag'?'active':'')+'" id="drop">'+icon('upload')+'<strong>'+(phase==='drag'?'Drop to edit picture':'Drop an image here')+'</strong><button type="button" id="choose">Choose picture</button><p>Or paste an image from your clipboard</p></div><p class="formats">JPEG, PNG, WebP or GIF</p>'}
function crop(){return '<div><div class="cropbox" id="cropbox" role="group" aria-label="Picture crop"><img id="cropimage" src="'+source+'" alt="Selected picture" draggable="false"><div class="mask"></div></div><div class="zoom"><label for="zoom">Zoom</label><input id="zoom" type="range" min="1" max="8" step=".01" value="'+zoom+'" aria-describedby="quality"><button type="button" class="ghost icon" id="reset" aria-label="Reset crop">'+icon('reset')+'</button></div><p class="quality" id="quality">'+icon('warn')+'<span>This crop will be enlarged and may look pixelated.</span></p><div class="replace"><span class="muted small">Drag to reposition</span><button type="button" class="ghost" id="choose">Choose another picture</button></div></div>'}
function feedback(){let text='';if(phase==='processing')text='<span class="spinner" aria-hidden="true"></span><span>Processing picture…</span><button class="ghost icon" id="cancel-process" aria-label="Cancel picture processing">'+icon('x')+'</button>';if(phase==='saving')text='<span class="spinner" aria-hidden="true"></span><span>Saving picture…</span>';if(phase==='error')return '<div class="feedback error" role="alert"><p>We couldn’t save your picture. Your crop is still here.</p><p>Try again when your connection is available.</p></div>';if(phase==='decode')return '<div class="feedback error" role="alert"><p>We couldn’t open this image.</p><p>Try again or choose another picture.</p><button id="retry-decode">Retry</button></div>';if(phase==='conflict')return '<div class="feedback error" role="alert"><p>Your Profile changed elsewhere.</p><p>Review the latest saved picture before retrying. Your crop is still here.</p><div class="review">'+avatar()+'<span class="small">Latest saved picture</span></div></div>';return '<div class="feedback" role="status">'+text+'</div>'}
function footer(){const busy=['processing','saving','select','drag','decode','loading','unavailable'].includes(phase);return '<div class="footer"><button class="danger" id="generated">Reset</button><div class="footer-end"><button id="cancel" '+(phase==='saving'?'disabled':'')+'>Cancel</button><button class="primary" id="apply" '+(busy?'disabled':'')+'>'+(phase==='saving'?'Saving picture…':['error','conflict'].includes(phase)?'Retry':'Apply')+'</button></div></div>'}
function render(){document.querySelector('#scenario').value=phase;app.className='app '+(dark?'dark ':'')+(mobile?'mobile ':'')+(reduced?'reduced':'');document.querySelector('#navavatar').innerHTML=avatar();document.querySelector('#settingavatar').innerHTML=avatar(true);let selecting=['select','drag','decode'].includes(phase),loading=['loading','unavailable'].includes(phase);let content=selecting?drop():crop();if(loading)content='<div class="load-review">'+avatar(true)+'<div><h3>'+(phase==='loading'?'Your picture is saved':'Picture temporarily unavailable')+'</h3><p>'+(phase==='loading'?'Loading the new image in settings and navigation.':'The saved picture is unchanged. Showing the generated avatar after bounded retries.')+'</p></div></div><button id="load-success" class="primary">'+(phase==='loading'?'Simulate image loaded':'Retry image load')+'</button><button id="load-fail" style="margin-left:8px">'+(phase==='loading'?'Simulate load failure':'Use generated avatar')+'</button>';
let inner='';if(variant==='A')inner='<div class="body">'+content+(!loading?feedback()+footer():'')+'</div>';if(variant==='B')inner='<div class="side"><div>'+content+'</div><aside class="rail"><h3>'+(selecting?'Choose a picture':'Frame your picture')+'</h3><p>'+(selecting?'Choose a file, drop it onto this dialog, or paste an image.':'Drag the image to move it. Zoom to choose what stays in the frame.')+'</p><p>JPEG, PNG, WebP or GIF</p>'+(!loading?feedback():'')+'</aside></div>'+(!loading?footer():'');if(variant==='C')inner='<div class="steps">'+['Choose','Frame','Save'].map((s,i)=>'<span class="'+((selecting?0:loading?2:1)===i?'current':'')+'"><b>'+(i+1)+'</b>'+s+'</span>').join('')+'</div>'+content+(!loading?'<div class="dock">'+feedback()+footer()+'</div>':'');stage.className='stage layout-'+variant;stage.innerHTML='<section class="dialog" role="dialog" aria-modal="false" aria-labelledby="title"><div class="heading"><h2 id="title">Profile picture</h2><p>'+(loading?'Saved image delivery preview':selecting?'Choose, drop, or paste an image to begin.':'Choose what appears inside the circle.')+'</p></div><button class="close ghost icon" id="close" aria-label="Close">'+icon('x')+'</button>'+inner+'</section>';document.querySelector('#variant-label').textContent=variant+' · '+names[variant];document.querySelector('#description').textContent=descriptions[variant];document.querySelector('#theme').textContent=dark?'Light theme':'Dark theme';document.querySelector('#mobile').textContent=mobile?'Desktop width':'Mobile width';document.querySelector('#motion').textContent=reduced?'Normal motion':'Reduced motion';bind();updateCrop();showState();}
function showState(){document.querySelector('#state').textContent='Prototype state: '+JSON.stringify({variant,phase,sourcePixels:sourceSize,cropPixels:Math.round(sourceSize/zoom),outputPixels:512,enlarged:sourceSize/zoom<512,theme:dark?'dark':'light',width:mobile?'360px':'responsive',reducedMotion:reduced});}
function updateCrop(){const img=document.querySelector('#cropimage');if(!img)return;img.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';const slider=document.querySelector('#zoom');slider.value=zoom;slider.disabled=['processing','saving'].includes(phase);document.querySelector('#reset').disabled=slider.disabled;document.querySelector('#choose').disabled=phase==='saving';const q=document.querySelector('#quality');q.classList.toggle('warn',sourceSize/zoom<512);showState();}
function on(id,fn,event='click'){const el=document.getElementById(id);if(el)el.addEventListener(event,fn)}
function switchVariant(delta){const list=['A','B','C'];variant=list[(list.indexOf(variant)+delta+3)%3];try{const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url)}catch{}render()}
function setPhase(next){clearTimeout(timer);phase=next;if(next==='crop'||next==='error'||next==='conflict'){if(zoom===1)zoom=2.5}render()}
function bind(){on('choose',()=>document.querySelector('#file').click());on('retry-decode',select);on('cancel-process',()=>setPhase('crop'));on('cancel',()=>setPhase('select'));on('close',()=>setPhase('select'));on('generated',()=>{phase='unavailable';render()});on('reset',()=>{zoom=1;panX=panY=0;render()});on('zoom',e=>{zoom=Number(e.target.value);updateCrop()},'input');on('apply',()=>{setPhase('processing');timer=setTimeout(()=>{setPhase('saving');timer=setTimeout(()=>setPhase('loading'),1400)},1600)});on('load-success',()=>setPhase(phase==='unavailable'?'loading':'crop'));on('load-fail',()=>setPhase(phase==='loading'?'unavailable':'select'));const box=document.querySelector('#cropbox');if(box){let start=null;box.onpointerdown=e=>{start={x:e.clientX,y:e.clientY,px:panX,py:panY};box.setPointerCapture(e.pointerId)};box.onpointermove=e=>{if(!start)return;const max=box.clientWidth*Math.max(0,zoom-1)/2;panX=Math.max(-max,Math.min(max,start.px+e.clientX-start.x));panY=Math.max(-max,Math.min(max,start.py+e.clientY-start.y));updateCrop()};box.onpointerup=()=>start=null;box.onpointercancel=()=>start=null;}}
on('prev',()=>switchVariant(-1));on('next',()=>switchVariant(1));on('theme',()=>{dark=!dark;render()});on('mobile',()=>{mobile=!mobile;render()});on('motion',()=>{reduced=!reduced;render()});on('scenario',e=>setPhase(e.target.value),'change');on('file',async e=>{const file=e.target.files[0];if(!file)return;const image=new Image();const url=URL.createObjectURL(file);image.onload=()=>{if(source.startsWith('blob:'))URL.revokeObjectURL(source);source=url;sourceSize=Math.min(image.width,image.height);select()};image.onerror=()=>{URL.revokeObjectURL(url);setPhase('decode')};image.src=url;e.target.value=''},'change');
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1)}});
stage.addEventListener('dragenter',e=>{if(!e.dataTransfer.types.includes('Files'))return;e.preventDefault();dragDepth++;if(['select','drag','decode'].includes(phase)){phase='drag';render()}});stage.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault()});stage.addEventListener('dragleave',()=>{dragDepth--;if(dragDepth<=0&&phase==='drag'){dragDepth=0;phase='select';render()}});stage.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;const file=e.dataTransfer.files[0];if(file){const dt=new DataTransfer();dt.items.add(file);document.querySelector('#file').files=dt.files;document.querySelector('#file').dispatchEvent(new Event('change'))}else setPhase('select')});
document.addEventListener('paste',e=>{const item=Array.from(e.clipboardData?.items||[]).find(x=>x.kind==='file'&&x.type.startsWith('image/'));const file=item?.getAsFile();if(!file)return;e.preventDefault();const dt=new DataTransfer();dt.items.add(file);document.querySelector('#file').files=dt.files;document.querySelector('#file').dispatchEvent(new Event('change'))});
render();
</script></body></html>
