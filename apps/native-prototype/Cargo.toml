[package]
name = "wallpaperdb-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
tiny_http = "0.12"
url = "2"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
