name: Diagnostic 537 (not a repair)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-537.yml'
      - 'apps/web/test/diagnostics/crop-trace.ts'
      - 'apps/web/test/components/profile/profile-picture-settings.dom.test.tsx'

permissions:
  contents: read

jobs:
  paired-fixtures:
    if: github.head_ref == 't3/fix-537-profile-crop-timeout'
    name: Diagnostic 537 paired fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.17'
          install_args: --locked
      - name: Prepare prerequisites before experiment
        env:
          CURSOR_SECRET: ${{ secrets.CURSOR_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_BASE_TEST_EMAIL: ${{ secrets.E2E_BASE_TEST_EMAIL }}
          E2E_BASE_TEST_PASSWORD: ${{ secrets.E2E_BASE_TEST_PASSWORD }}
        run: |
          make toolchain
          make install
          make build TURBO_FLAGS='--filter=!@wallpaperdb/factory'
      - name: One uncached full repository workload with the controlled fixture pair
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
        run: |
          destination=/tmp/flake537-evidence
          mkdir -p "$destination"
          git rev-parse HEAD > "$destination/tested-sha.txt"
          target=apps/web/test/components/profile/profile-picture-settings.dom.test.tsx
          cp "$target" "$destination/paired-target.tsx"
          cp apps/web/test/diagnostics/crop-trace.ts "$destination/crop-trace.ts"
          git show "256476a31463b3ef5d7a45458ae7c7c011ec6aba:$target" > "$destination/unmodified-current-target.tsx"
          git show "6a79b096a2980cd77909e75f98dc5ed3ed3b6b72:$target" > "$destination/historical-target-reference.tsx"
          sha256sum "$destination/"*.tsx "$destination/crop-trace.ts" > "$destination/source-hashes.txt"
          lscpu > "$destination/runner-cpu.txt"
          make toolchain > "$destination/toolchain.txt"
          start=$(date +%s)
          set +e
          make test-unit TURBO_FLAGS='--filter=!@wallpaperdb/factory --force --continue=always' 2>&1 | tee "$destination/workload.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "result=$result elapsed=$(( $(date +%s) - start ))s" > "$destination/timing.txt"
          cp /tmp/flake537-web-results.json "$destination/" || true
          cp /tmp/flake537-trace-*.jsonl "$destination/" || true
          python - "$destination" <<'PY'
          import json, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          report = json.loads((directory / 'flake537-web-results.json').read_text())
          files = [r for r in report['testResults'] if r['name'].endswith('/profile-picture-settings.dom.test.tsx')]
          assert len(files) == 1, 'Owning file not executed exactly once'
          tests = files[0]['assertionResults']
          targets = [t for t in tests if t['title'].startswith('warns below Zoom when a crop needs enlargement, clears on reset, and still permits Apply (')]
          assert len(tests) == 56 and len(targets) == 2, 'Paired file scenarios missing'
          summary = {'fileTests': len(tests), 'statuses': [t['status'] for t in tests], 'targets': targets}
          (directory / 'paired-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          PY
          exit "$result"
      - name: Preserve source, raw results and both lifecycle traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-537-paired-fixtures
          path: /tmp/flake537-evidence
          if-no-files-found: warn
          retention-days: 30
