name: PR history

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [requested, completed]
  schedule:
    - cron: '7,22,37,52 * * * *'

# Every event reconciles live state after admission to this shared publisher.
concurrency:
  group: pr-history-publication
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  history:
    name: Rebase merge history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.17'
          install_args: --locked
      - name: Verify effective tools
        run: make toolchain
      - name: Revalidate submitted history against the current base
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-pr-history-status.mjs "$PR_NUMBER"
      - name: Reconcile all open PRs against their live bases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-history-status.mjs
