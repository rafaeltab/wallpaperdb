name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  ci:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI_RUNTIME_PROFILE: 'true'
      USE_VERCEL_CACHE: ${{ vars.TURBO_TEAM != '' && (github.actor_id == '29227505' || github.actor_id == '290168728') && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ">=22.12.0 <23"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
        env:
          CURSOR_SECRET: ${{ secrets.CURSOR_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_BASE_TEST_EMAIL: ${{ secrets.E2E_BASE_TEST_EMAIL }}
          E2E_BASE_TEST_PASSWORD: ${{ secrets.E2E_BASE_TEST_PASSWORD }}

      - name: Install turbo
        run: pnpm add -g turbo

      - name: Set up Vercel Remote Cache
        if: env.USE_VERCEL_CACHE == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Report unavailable Turbo cache
        if: env.USE_VERCEL_CACHE != 'true'
        run: echo '::warning::Vercel Remote Cache is unavailable for this run; Turbo tasks have no shared cache.'
      - name: Build, lint, and type-check
        run: node scripts/ci-runtime.mjs check -- make check

      - name: Install Chromium for browser adapter contracts
        run: make run PACKAGE=web SCRIPT=test:browser:install

      - name: Run unit and integration tests
        run: |
          node scripts/ci-runtime.mjs unit -- make test-unit
          node scripts/ci-runtime.mjs integration -- make test-integration
        env:
          TURBO_TOKEN: ''
          TURBO_TEAM: ''

      - name: Merge coverage reports
        run: pnpm coverage:merge

      - name: Upload CI runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-runtime-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            test-results/ci-runtime/
            apps/gateway/test-results/ci-runtime-*.jsonl
            apps/gateway/test-results/ci-runtime-vitest*.json
            apps/ingestor/test-results/ci-runtime-*.jsonl
            apps/ingestor/test-results/ci-runtime-vitest*.json
            apps/gateway/.turbo/turbo-test_integration.log
            apps/ingestor/.turbo/turbo-test_integration.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: ci
          token: ${{ secrets.CODECOV_TOKEN }}
