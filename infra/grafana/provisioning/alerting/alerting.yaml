apiVersion: 1

groups:
  - orgId: 1
    name: WallpaperDB Alerts
    folder: WallpaperDB
    interval: 1m
    rules:
      - uid: high-upload-failure-rate
        title: High Upload Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(upload_requests_total{status="error"}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(upload_requests_total[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A / $B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Upload failure rate is above 5%
          description: "The upload failure rate has exceeded 5% in the last 5 minutes. Current rate: {{ $values.C }}%"
        labels:
          severity: warning

      - uid: slow-uploads-p95
        title: Slow Upload Response Time (p95)
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(upload_duration_ms_bucket[5m])) by (le))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Upload p95 latency exceeds 10 seconds
          description: "Upload response time (p95) has exceeded 10 seconds. Current: {{ $values.A }}ms"
        labels:
          severity: warning

      - uid: storage-operation-failures
        title: Storage Operation Failures
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(storage_operations_total{operation_success="false"}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Object storage (S3) operations are failing
          description: "Storage operations have failed {{ $values.A }} times in the last 5 minutes"
        labels:
          severity: critical

      - uid: reconciliation-errors
        title: Reconciliation Errors
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(reconciliation_errors_total[5m])) by (reconciliation_type)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: $A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Reconciliation job is experiencing errors
          description: "Reconciliation errors have exceeded threshold. Count: {{ $values.A }}"
        labels:
          severity: warning

      - uid: gateway-quota-unenforced
        title: Gateway Quota Enforcement Unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(admission_quota_unenforced_total[5m])) or vector(0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Gateway admitted requests without enforcing the configured quota
          description: "Requests bypassed distributed quota enforcement in the last 5 minutes. Inspect admission_quota_unenforced_total by reason: disabled, unavailable, saturated, or command_failure. Saturated means all 64 local command slots are occupied; bypasses can occur even with healthy Redis. Check REDIS_ENABLED, connectivity, and command failures or timeouts. The counter is emitted only when the admission policy is enabled."
        labels:
          severity: critical
          service: gateway

      - uid: ingestor-quota-local-fallback
        title: Ingestor Distributed Quota Degraded
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(ingestion_quota_local_fallback_total[5m])) or vector(0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Ingestor is enforcing upload quotas independently on each instance
          description: "Uploads used local quota windows instead of the shared Redis quota in the last 5 minutes. Inspect ingestion_quota_local_fallback_total by reason: unavailable, saturated, or command_failure. Local windows remain bounded, but uploads distributed across instances can consume more than the shared Profile limit. Check Redis connectivity, command deadlines, and concurrent command saturation (64 per instance)."
        labels:
          severity: critical
          service: ingestor

      - uid: user-dependency-unhealthy
        title: User Dependency or Protective Worker Unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: min by (dependency) (user_dependency_healthy{required="true"} or user_dependency_last_operation_healthy)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: A required User dependency or protective worker is unavailable
          description: "Inspect the dependency label and User logs. Database and NATS failures prevent durable Profile operations. Worker failures can stop event publication, ownership updates, initial picture imports, or retention cleanup while HTTP requests continue to succeed. Identity, picture-source and picture-storage signals describe their last operation; a technical failure remains visible through idle periods and retry backoff until a subsequent operation succeeds. Intentionally disabled telemetry is marked optional and does not trigger this rule."
        labels:
          severity: critical
          service: user

      - uid: user-dependency-signal-missing
        title: User Dependency Monitoring Signal Missing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                (time() - user_dependency_observed_at_seconds > bool 120)
                or absent_over_time(user_dependency_observed_at_seconds[5m])
                or absent_over_time(user_dependency_healthy{dependency="database",required="true"}[5m])
                or absent_over_time(user_dependency_healthy{dependency="nats",required="true"}[5m])
                or absent_over_time(user_dependency_healthy{dependency="workers",required="true"}[5m])
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: User dependency observations are stale or absent
          description: "The monitored User deployment has stopped reporting fresh dependency observations. Check process availability, the scoped monitor, telemetry initialization, and the collector. This rule expects telemetry-enabled deployments; disable this missing-signal rule for deployments that intentionally turn all telemetry off. Optional telemetry is excluded from dependency-failure alerts, but an absent stream alone cannot distinguish intentional disablement from a dead service."
        labels:
          severity: critical
          service: user
