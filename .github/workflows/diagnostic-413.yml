name: Diagnostic 413 controlled and untraced

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-413.yml'
      - 'packages/react-muuri/**'

permissions:
  contents: read

jobs:
  observe:
    name: Diagnostic 413 (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [untraced, controlled]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.17'
          install_args: --locked
      - run: make toolchain
      - run: make install
      - name: Prepare dependency outputs before experiments
        run: make build PACKAGE=vitest-config
      - name: Record tested revision and scheduling
        run: |
          git rev-parse HEAD
          nproc
          cat packages/react-muuri/vitest.config.ts
          cat packages/vitest-config/src/defaults.ts
      - name: Restore exact unmodified base source and target test
        if: matrix.mode == 'untraced'
        run: |
          git restore --source=256476a31463b3ef5d7a45458ae7c7c011ec6aba -- packages/react-muuri/src/MuuriGrid.tsx packages/react-muuri/test/integration
          git diff 256476a31463b3ef5d7a45458ae7c7c011ec6aba --exit-code -- packages/react-muuri/src/MuuriGrid.tsx packages/react-muuri/test/integration/dynamic-items.test.tsx
          git hash-object packages/react-muuri/src/MuuriGrid.tsx packages/react-muuri/test/integration/dynamic-items.test.tsx
      - name: Untraced representative full unit workload without test-result cache
        if: matrix.mode == 'untraced'
        run: |
          mkdir -p diagnostic-413
          set -o pipefail
          make test-unit PACKAGE=react-muuri TURBO_FLAGS='--filter=@wallpaperdb/react-muuri --force -- --silent=false' 2>&1 | tee diagnostic-413/untraced-full-unit.log
      - name: Controlled real-import publication ordering, preserve failing assertions
        if: matrix.mode == 'controlled'
        run: |
          mkdir -p diagnostic-413
          set -o pipefail
          make run PACKAGE=react-muuri SCRIPT=test:unit ARGS="test/integration/diagnostic-413-schedule.test.tsx --silent=false --reporter=default --reporter=json --outputFile=$GITHUB_WORKSPACE/diagnostic-413/controlled.json" 2>&1 | tee diagnostic-413/controlled.log
      - name: Preserve lifecycle traces and actual test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-413-${{ matrix.mode }}
          path: diagnostic-413/
          if-no-files-found: warn
