# PROTOTYPE: isolated OpenSearch for global color ordering experiments.
services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      discovery.type: single-node
      cluster.name: color-global-prototype
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms2g -Xmx2g'
    cpus: 4
    mem_limit: 4g
    ports:
      - '127.0.0.1:19216:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 60
