name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      USE_VERCEL_CACHE: ${{ vars.TURBO_TEAM != '' && (github.actor_id == '29227505' || github.actor_id == '290168728') && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
      COMPOSE_PROJECT_NAME: wallpaperdb
      COMPOSE_PROFILES: ''
      CURSOR_SECRET: ${{ secrets.CURSOR_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      E2E_BASE_TEST_EMAIL: ${{ secrets.E2E_BASE_TEST_EMAIL }}
      E2E_BASE_TEST_PASSWORD: ${{ secrets.E2E_BASE_TEST_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ">=22.12.0 <23"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Set up Vercel Remote Cache
        if: env.USE_VERCEL_CACHE == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Report unavailable Turbo cache
        if: env.USE_VERCEL_CACHE != 'true'
        run: echo '::warning::Vercel Remote Cache is unavailable for this run; Turbo tasks have no shared cache.'

      - name: Build
        run: make build

      - name: Install Playwright browsers
        run: pnpm --filter @wallpaperdb/web-e2e exec playwright install --with-deps chromium

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Prepare Compose image build plan
        run: make apps-build ARGS=--print > "$RUNNER_TEMP/app-images.json"

      - name: Build and load application images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ runner.temp }}/app-images.json
          load: true
          # Each service owns a scope. A cache outage must not fail a correct build.
          set: |
            ingestor.cache-from=type=gha,version=2,scope=browser-e2e-ingestor,timeout=60s
            ingestor.cache-to=type=gha,version=2,scope=browser-e2e-ingestor,mode=max,ignore-error=true,timeout=60s
            asset.cache-from=type=gha,version=2,scope=browser-e2e-asset,timeout=60s
            asset.cache-to=type=gha,version=2,scope=browser-e2e-asset,mode=max,ignore-error=true,timeout=60s
            gateway.cache-from=type=gha,version=2,scope=browser-e2e-gateway,timeout=60s
            gateway.cache-to=type=gha,version=2,scope=browser-e2e-gateway,mode=max,ignore-error=true,timeout=60s
            variant-generator.cache-from=type=gha,version=2,scope=browser-e2e-variant-generator,timeout=60s
            variant-generator.cache-to=type=gha,version=2,scope=browser-e2e-variant-generator,mode=max,ignore-error=true,timeout=60s
            color-extractor.cache-from=type=gha,version=2,scope=browser-e2e-color-extractor,timeout=60s
            color-extractor.cache-to=type=gha,version=2,scope=browser-e2e-color-extractor,mode=max,ignore-error=true,timeout=60s
            tags.cache-from=type=gha,version=2,scope=browser-e2e-tags,timeout=60s
            tags.cache-to=type=gha,version=2,scope=browser-e2e-tags,mode=max,ignore-error=true,timeout=60s
            user.cache-from=type=gha,version=2,scope=browser-e2e-user,timeout=60s
            user.cache-to=type=gha,version=2,scope=browser-e2e-user,mode=max,ignore-error=true,timeout=60s
            web.cache-from=type=gha,version=2,scope=browser-e2e-web,timeout=60s
            web.cache-to=type=gha,version=2,scope=browser-e2e-web,mode=max,ignore-error=true,timeout=60s

      - name: Start infrastructure
        run: make infra-start

      - name: Start application stack for browser E2E
        run: make apps-start ARGS=--no-build

      - name: Run E2E tests
        run: make test-e2e PACKAGE=web-e2e
        env:
          TURBO_TOKEN: ''
          TURBO_TEAM: ''

      - name: Capture browser E2E service diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/web-e2e
          docker compose -p "$COMPOSE_PROJECT_NAME" -f infra/docker-compose.yml logs --no-color > artifacts/web-e2e/infra.log
          docker compose -p "$COMPOSE_PROJECT_NAME" -f infra/docker-compose.apps.yml logs --no-color > artifacts/web-e2e/apps.log

      - name: Upload browser E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure-artifacts
          if-no-files-found: ignore
          path: |
            apps/web-e2e/playwright-report
            apps/web-e2e/test-results
            artifacts/web-e2e

      - name: Stop application stack
        if: always()
        run: make apps-stop

      - name: Stop infrastructure
        if: always()
        run: make infra-stop

  container_e2e:
    name: Container E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      USE_VERCEL_CACHE: ${{ vars.TURBO_TEAM != '' && (github.actor_id == '29227505' || github.actor_id == '290168728') && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ">=22.12.0 <23"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Set up Vercel Remote Cache
        if: env.USE_VERCEL_CACHE == 'true'
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Report unavailable Turbo cache
        if: env.USE_VERCEL_CACHE != 'true'
        run: echo '::warning::Vercel Remote Cache is unavailable for this run; Turbo tasks have no shared cache.'

      - name: Build
        run: make build

      - name: Run container E2E tests
        run: make test-e2e TURBO_FLAGS='--filter=!@wallpaperdb/web-e2e'
        env:
          TURBO_TOKEN: ''
          TURBO_TEAM: ''
